<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        padding: 0px;
        margin: 0px;
        
    }
    .navbar{
        background-color: rgb(158, 53, 255);
        padding: 20px;
        display: flex;
        justify-content: space-between;

    }
    .logo{
        color: aliceblue;
        font-size: 20px;
        font-family: fantasy;
    }
    .links a{
        color: antiquewhite;
        text-decoration: none;
        margin-right: 10px;
        font-size: 20px;
    }
    .logout button{
        background-color: rgb(77, 55, 82);
        color: rgb(235, 227, 242);
        font-size: 20px;
        border: none;
        padding: 5px;
       border-radius: 5px;
       box-shadow: 0px 0px 12px;
        



    }

</style>
<body>
    <div class="navbar">

        <div class="logo">
            My website
        </div>

        <div class="links">
        <a href="">Home</a>
        <a href="">About</a>
        <a href="">Service</a>
        <a href="">Contact</a>
        </div>

        <div class="logout">
            <button>logout</button>
        </div>

    </div>

</html>
