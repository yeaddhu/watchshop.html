<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>

    <form action="">


    <label for="">Name:</label>
    <input type="text" name="name" placeholder="enter your name" required>

    <label for="">Email</label>
    <input type="email" name="email" placeholder="enter your email" required>

    <label for="">phone number</label>
    <input type="tel" name="ph">
    
    <label for="">password</label>
    <input type="password" name="password">

    <label for="">comments/messages:</label>
    <input type="msg">

    <label for="gender"></label>
    <input type="radio" name="gender" value="male">male
    <input type="radio" name="gender" value="female">female
     <input type="radio" name="gender" value="other">other

     <label for="skill"></label>
     <input type="checkbox" name="skill" value="+2">+2
     <input type="checkbox" name="skill" value="sslc">sslc
     <input type="checkbox" name="skill" value="degree">degree
     
     <label for="country"></label>
     <select name="country" id="">
     <option value="ind">ind</option>
     <option value="chai">chai</option>
     <option value="thai">thai</option>
     </select>

     <label for="Dob"></label>
     <input type="date" name="date">
     
     <label for="quantity"></label>
     <input type="number" name="quantity">

     <label for="">photo</label>
     <input type="file" name="photo">


    <input type="submit" value="submit">

    <input type="exit" value="exit">
    <button type="submit">subitt</button>
    <button type="reset">cancel</button>
    </form>

    
</body>
</html>
